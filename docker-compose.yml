services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Run ./setup.sh first.}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Run ./setup.sh first.}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    container_name: synapse-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synapse}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required. Run ./setup.sh first.}
      BASE_URL: ${BASE_URL:?BASE_URL is required. Run ./setup.sh first.}
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-demo@synapse.dev}
      STORAGE_DIR: /app/storage/files
      # Embedding model + OCR data are baked into the image under /app/models
      # (outside the api_storage volume mount, which would otherwise shadow
      # them). Runtime model download is OFF — a missing model is a baked-in
      # build failure, never a silent runtime degradation.
      MEMORY_ALLOW_RUNTIME_MODEL_DOWNLOAD: ${MEMORY_ALLOW_RUNTIME_MODEL_DOWNLOAD:-false}
      MEMORY_MODEL_CACHE_DIR: /app/models/memory
      TESSERACT_LANG_PATH: /app/models/tessdata
      TESSERACT_LANGS: ${TESSERACT_LANGS:-chi_sim+chi_tra+eng+jpn}
      # External-reachable registry URL the API embeds into the dashboard's
      # one-click daemon install command. Empty => command omits --registry.
      PUBLIC_NPM_REGISTRY_URL: ${PUBLIC_NPM_REGISTRY_URL:-}
      # --- server-side actor isolation (sandbox) ---
      # Off by default. Set SYNAPSE_SANDBOX_ENABLED=true + SANDBOX_BACKEND=docker
      # (+ run the 'sandbox' build + tunnel-edge) to enable containerized sandboxes.
      SYNAPSE_SANDBOX_ENABLED: ${SYNAPSE_SANDBOX_ENABLED:-false}
      SYNAPSE_SANDBOX_BACKEND: ${SYNAPSE_SANDBOX_BACKEND:-local}
      SYNAPSE_SANDBOX_TUNNEL: ${SYNAPSE_SANDBOX_TUNNEL:-none}
      SYNAPSE_SANDBOX_IMAGE: ${SYNAPSE_SANDBOX_IMAGE:-synapse-device-runtime:latest}
      SYNAPSE_SANDBOX_DOCKER_NETWORK: ${SYNAPSE_SANDBOX_DOCKER_NETWORK:-synapse-sandbox-egress}
      SYNAPSE_SANDBOX_STORAGE_VOLUME: ${SYNAPSE_SANDBOX_STORAGE_VOLUME:-synapse_api_storage}
      # Internal address the sandbox container dials back to (NOT the public
      # APP_BASE_URL — the sandbox is on an internal-only network).
      SYNAPSE_SANDBOX_SERVER_ORIGIN: ${SYNAPSE_SANDBOX_SERVER_ORIGIN:-http://api:3001}
      # Tunnel + signing for device dispatch (required when sandbox+tunnel on).
      SYNAPSE_DEVICE_TUNNEL_EDGE_URL: ${SYNAPSE_DEVICE_TUNNEL_EDGE_URL:-http://tunnel-edge:8080}
      SYNAPSE_DEVICE_ENVELOPE_SIGNING_KEY: ${SYNAPSE_DEVICE_ENVELOPE_SIGNING_KEY:-}
      SYNAPSE_TUNNEL_VHOST_HOST: ${SYNAPSE_TUNNEL_VHOST_HOST:-tunnel-edge}
      FRP_SHARED_TOKEN: ${FRP_SHARED_TOKEN:-}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - api_storage:/app/storage
      # DooD: the docker SandboxBackend runs cloud-sandbox containers via the
      # host daemon. Mounted read-write; the backend only ever runs the pinned
      # SYNAPSE_SANDBOX_IMAGE with a fixed arg allowlist.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # Keep the default network (postgres/redis/web) AND join the sandbox
      # egress network so the API is reachable from sandbox containers.
      - default
      - synapse-sandbox-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - production

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required. Run ./setup.sh first.}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required. Run ./setup.sh first.}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required. Run ./setup.sh first.}
        API_PROXY_ORIGIN: http://api:3001
    container_name: synapse-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required. Run ./setup.sh first.}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required. Run ./setup.sh first.}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required. Run ./setup.sh first.}
      API_PROXY_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles:
      - production

  mobile-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.mobile-web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?EXPO_PUBLIC_API_URL is required. Run ./setup.sh first.}
        EXPO_BASE_URL: ${EXPO_BASE_URL:-/mobile}
    container_name: synapse-mobile-web
    restart: unless-stopped
    expose:
      - "80"
    profiles:
      - production

  nginx:
    image: nginx:alpine
    container_name: synapse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SYNAPSE_PUBLIC_DOMAIN: ${SYNAPSE_PUBLIC_DOMAIN:?SYNAPSE_PUBLIC_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_WWW_DOMAIN: ${SYNAPSE_WWW_DOMAIN:?SYNAPSE_WWW_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_MOBILE_SHORT_DOMAIN: ${SYNAPSE_MOBILE_SHORT_DOMAIN:?SYNAPSE_MOBILE_SHORT_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_MOBILE_DOMAIN: ${SYNAPSE_MOBILE_DOMAIN:?SYNAPSE_MOBILE_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_REGISTRY_DOMAIN: ${SYNAPSE_REGISTRY_DOMAIN:?SYNAPSE_REGISTRY_DOMAIN is required. Run ./setup.sh first.}
      LETSENCRYPT_CERT_NAME: ${LETSENCRYPT_CERT_NAME:?LETSENCRYPT_CERT_NAME is required. Run ./setup.sh first.}
    volumes:
      - ./infrastructure/nginx/public.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - mobile-web
    profiles:
      - tls

  nginx-http:
    image: nginx:alpine
    container_name: synapse-nginx-http
    restart: unless-stopped
    ports:
      - "${SYNAPSE_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/public-http.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
      - web
      - mobile-web
    profiles:
      - http

  acme-http:
    image: nginx:alpine
    container_name: synapse-acme-http
    ports:
      - "80:80"
    volumes:
      - certbot_www:/usr/share/nginx/html
    profiles:
      - certbot

  certbot:
    image: certbot/certbot:latest
    container_name: synapse-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - certbot

  # Device Runtime v3: reverse-tunnel edge (frps). Devices dial in here from
  # arbitrary networks; proxied app endpoints stay on the internal docker
  # network (only the API container reaches them). See
  # docs/device-runtime-v3.md §4.4 / §7.3.
  tunnel-edge:
    image: snowdreamtech/frp:0.65.0
    container_name: synapse-tunnel-edge
    restart: unless-stopped
    command: ["frps", "-c", "/etc/frp/frps.toml"]
    environment:
      # frps.toml renders auth.token from {{ .Envs.FRP_SHARED_TOKEN }}.
      FRP_SHARED_TOKEN: ${FRP_SHARED_TOKEN:-}
    volumes:
      - ./infrastructure/frp/frps.toml:/etc/frp/frps.toml:ro
    ports:
      # Public control listener — frpc dials this from anywhere.
      - "${SYNAPSE_TUNNEL_EDGE_PORT:-7000}:7000"
      # vhost HTTP — proxied device MCP endpoints. NOT bound to a host port;
      # only reachable via the synapse internal networks.
    networks:
      # default → reachable by the API for dispatch; sandbox-egress → reachable
      # by frpc inside sandbox containers.
      - default
      - synapse-sandbox-egress
    profiles:
      # Sandboxed actor execution dispatches device tools through this edge, so
      # it must run in production too (not only the standalone 'devices' demo).
      - devices
      - production

  # Private npm registry (Verdaccio). Serves @synapse/* to end users and
  # caches third-party deps from npmjs. Published at the registry subdomain
  # via the public nginx (TLS terminated there); the 4873 host port is
  # bound to loopback only so the registry is never directly exposed. The
  # real registry hostname lives only in the gitignored .env
  # (SYNAPSE_REGISTRY_DOMAIN / PUBLIC_NPM_REGISTRY_URL), never in the repo.
  # See infra/verdaccio/README.md for publisher setup + the deny smoke test.
  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: synapse-verdaccio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - ./infra/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - ./infra/verdaccio/htpasswd:/verdaccio/conf/htpasswd
      - verdaccio_storage:/verdaccio/storage
    profiles:
      - registry

  # Build-only: produces the cloud-sandbox image the docker SandboxBackend runs
  # via DooD. NOT a long-running service. Build it with:
  #   docker compose --profile sandbox-build build sandbox-image
  # then set SYNAPSE_SANDBOX_IMAGE=synapse-device-runtime:latest. Self-contained
  # multi-stage (compiles TS + Rust inside), so no host prebuild is needed.
  sandbox-image:
    image: ${SYNAPSE_SANDBOX_IMAGE:-synapse-device-runtime:latest}
    build:
      context: .
      dockerfile: packages/device-runtime/docker/Dockerfile
    profiles:
      - sandbox-build

volumes:
  # Fixed name so the docker SandboxBackend's `--mount src=...` resolves the
  # volume regardless of the compose project prefix.
  api_storage:
    name: synapse_api_storage
  certbot_etc:
  certbot_www:
  pgdata:
  redisdata:
  verdaccio_storage:

networks:
  default:
  # Internal-only network for sandbox containers: reaches the API + tunnel-edge
  # (frpc/control-plane), but has NO public egress (internal: true) and is NOT
  # joined by postgres/redis — so a confined command sharing the container's
  # netns (--cmd-sandbox-share-net) can't reach the DB or the internet. Fixed
  # name so the backend's `docker run --network` matches.
  synapse-sandbox-egress:
    name: synapse-sandbox-egress
    internal: true
