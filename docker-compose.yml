# Shared container log rotation. Docker's default json-file driver has NO size
# bound, so without this every long-running service grows unbounded on disk.
# Applied to every long-running service below via the *default-logging anchor.
# (Aggregation/shipping is handled out-of-process by Alloy reading these files;
# see docs/logging-refactor/03-decisions.md.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Run ./setup.sh first.}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Run ./setup.sh first.}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    container_name: synapse-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synapse}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required. Run ./setup.sh first.}
      BASE_URL: ${BASE_URL:?BASE_URL is required. Run ./setup.sh first.}
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-demo@synapse.dev}
      STORAGE_DIR: /app/storage/files
      # Embedding model is baked into the image under /app/models (outside the
      # api_storage volume mount, which would otherwise shadow it). Runtime model
      # download is OFF — a missing model is a baked-in build failure, never a
      # silent runtime degradation.
      MEMORY_ALLOW_RUNTIME_MODEL_DOWNLOAD: ${MEMORY_ALLOW_RUNTIME_MODEL_DOWNLOAD:-false}
      MEMORY_MODEL_CACHE_DIR: /app/models/memory
      # OCR runs OUT-OF-PROCESS — the api bundles no OCR engine and reads env
      # only. OCR_PROVIDER selects the sidecar (tesseract | ppocr) or `none` to
      # disable. The default keeps OCR on via the tesseract sidecar (shipped in
      # the `production` profile); set OCR_PROVIDER=ppocr and start the `ppocr`
      # profile to use PP-OCRv6 instead.
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      TESSERACT_URL: ${TESSERACT_URL:-http://tesseract-ocr:8771/}
      TESSERACT_LANGS: ${TESSERACT_LANGS:-chi_sim+chi_tra+eng+jpn}
      PPOCR_URL: ${PPOCR_URL:-}
      PPOCR_TIER: ${PPOCR_TIER:-small}
      # External-reachable registry URL the API embeds into the dashboard's
      # one-click daemon install command. Empty => command omits --registry.
      PUBLIC_NPM_REGISTRY_URL: ${PUBLIC_NPM_REGISTRY_URL:-}
      # Internal URL of the optional Mijia MCP sidecar (gated by the `mijia`
      # compose profile). The Mijia builtin plugin is only SEEDED when this is
      # set, so leave it empty unless you actually run the sidecar. To enable:
      # set MIJIA_MCP_URL=http://mijia-mcp:8765/mcp/ in .env and start with
      # `--profile production --profile mijia`.
      MIJIA_MCP_URL: ${MIJIA_MCP_URL:-}
      # Optional mcp-plugins sidecars (overseas-only, opt-in). Each builtin
      # plugin is only SEEDED when its enable flag is set AND its *_MCP_URL is
      # populated, so leave these empty unless you run the matching sidecar
      # (compose `notion` / `xhs` profiles). Firecrawl is a hosted remote MCP
      # (no sidecar) gated by its flag alone. See .env.example.
      MCP_ENABLE_FIRECRAWL: ${MCP_ENABLE_FIRECRAWL:-}
      MCP_ENABLE_NOTION: ${MCP_ENABLE_NOTION:-}
      NOTION_MCP_URL: ${NOTION_MCP_URL:-}
      MCP_ENABLE_XHS: ${MCP_ENABLE_XHS:-}
      XHS_MCP_URL: ${XHS_MCP_URL:-}
      MCP_ENABLE_BILIBILI: ${MCP_ENABLE_BILIBILI:-}
      BILIBILI_MCP_URL: ${BILIBILI_MCP_URL:-}
      # --- server-side actor isolation (sandbox) ---
      # Off by default. Set SYNAPSE_SANDBOX_ENABLED=true + SANDBOX_BACKEND=docker
      # (+ run the 'sandbox' build + tunnel-edge) to enable containerized sandboxes.
      SYNAPSE_SANDBOX_ENABLED: ${SYNAPSE_SANDBOX_ENABLED:-false}
      SYNAPSE_SANDBOX_BACKEND: ${SYNAPSE_SANDBOX_BACKEND:-local}
      # The docker backend is reachable ONLY over the frp tunnel (the container
      # is on an internal-only network), so it requires SYNAPSE_SANDBOX_TUNNEL=frp
      # + FRP_SHARED_TOKEN — anything else fails fast at provision. The local
      # backend ignores this (its runtime uses a direct loopback endpoint).
      SYNAPSE_SANDBOX_TUNNEL: ${SYNAPSE_SANDBOX_TUNNEL:-frp}
      SYNAPSE_SANDBOX_IMAGE: ${SYNAPSE_SANDBOX_IMAGE:-synapse-device-runtime:latest}
      SYNAPSE_SANDBOX_DOCKER_NETWORK: ${SYNAPSE_SANDBOX_DOCKER_NETWORK:-synapse-sandbox-egress}
      SYNAPSE_SANDBOX_STORAGE_VOLUME: ${SYNAPSE_SANDBOX_STORAGE_VOLUME:-synapse_api_storage}
      # Where api_storage is mounted INSIDE this container. The API derives each
      # sandbox's volume-subpath as STORAGE_DIR relative to this path (here
      # STORAGE_DIR=/app/storage/files under /app/storage → files/sandboxes/<id>).
      # Only override if you remount the volume elsewhere.
      SYNAPSE_SANDBOX_STORAGE_VOLUME_MOUNT: ${SYNAPSE_SANDBOX_STORAGE_VOLUME_MOUNT:-/app/storage}
      # Internal address the sandbox container dials back to (NOT the public
      # APP_BASE_URL — the sandbox is on an internal-only network).
      SYNAPSE_SANDBOX_SERVER_ORIGIN: ${SYNAPSE_SANDBOX_SERVER_ORIGIN:-http://api:3001}
      # Tunnel + signing for device dispatch (required when sandbox+tunnel on).
      SYNAPSE_DEVICE_TUNNEL_EDGE_URL: ${SYNAPSE_DEVICE_TUNNEL_EDGE_URL:-http://tunnel-edge:8080}
      SYNAPSE_DEVICE_ENVELOPE_SIGNING_KEY: ${SYNAPSE_DEVICE_ENVELOPE_SIGNING_KEY:-}
      SYNAPSE_TUNNEL_VHOST_HOST: ${SYNAPSE_TUNNEL_VHOST_HOST:-tunnel-edge}
      FRP_SHARED_TOKEN: ${FRP_SHARED_TOKEN:-}
      # --- observability (logging refactor) ---
      # OTLP traces target. Set to http://alloy:4318 when running the
      # `observability` profile; empty => spans are created (logs carry trace_id)
      # but not exported. Nothing hardcoded — operator sets the host.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-synapse-api}
      # Self-hosted Sentry (errors + tracing). Empty => Sentry disabled. The DSN
      # / URL are env-only (never hardcoded — this is an open-source repo).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # Device log-ingest token secret (POST /api/v1/logs device-bearer path).
      # Empty => device log回传 disabled (browser/mobile session path still works).
      SYNAPSE_LOG_INGEST_SECRET: ${SYNAPSE_LOG_INGEST_SECRET:-}
      # Expose the OTel trace_id to clients in response headers (Server-Timing
      # trace;desc + W3C traceresponse). off | errors (default, 5xx only) | on.
      SYNAPSE_SERVER_TIMING_TRACE: ${SYNAPSE_SERVER_TIMING_TRACE:-errors}
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      # Lets the API reach an AI base URL served on the host (set a model item's
      # baseUrl in packages/api/config/model-groups.yaml to
      # http://host.docker.internal:<port>).
      - "host.docker.internal:host-gateway"
    volumes:
      - api_storage:/app/storage
      # Declarative model-groups config, mounted read-only so the importer
      # (db:rebuild / db:seed:model-groups) reads the operator's real file at
      # /app/packages/api/config/model-groups.yaml. The real .yaml is gitignored
      # + dockerignored (kept out of the image); secrets stay in env_file via
      # ${ENV} interpolation. Follows the verdaccio/frp/nginx config-mount idiom.
      - ./packages/api/config:/app/packages/api/config:ro
      # NOTE: the docker SandboxBackend (DooD) needs the host docker socket, but
      # it is NOT mounted here — that would give EVERY production API container
      # host-root-equivalent access even though sandboxes default to
      # local/disabled. The socket is opt-in via the dedicated override:
      #   docker compose -f docker-compose.yml -f docker-compose.sandbox-docker.yml ...
      # which appends the socket mount. See deploy.md §8b.
    networks:
      # Keep the default network (postgres/redis/web) AND join the sandbox
      # egress network so the API is reachable from sandbox containers.
      - default
      - synapse-sandbox-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - production

  # OCR sidecar: native tesseract-ocr behind a small FastAPI service. The api
  # bundles NO OCR engine (zero-OCR-api); it POSTs image bytes here and gets back
  # text. Shipped in the `production` profile so a default deploy keeps image OCR
  # working out-of-process. Reached by the api at http://tesseract-ocr:8771/
  # (OCR_PROVIDER=tesseract + TESSERACT_URL). Internal-only, no host port, no
  # secrets (explicit env allowlist, NOT env_file).
  tesseract-ocr:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.tesseract
    container_name: synapse-tesseract-ocr
    restart: unless-stopped
    logging: *default-logging
    environment:
      TESSERACT_HOST: "0.0.0.0"
      TESSERACT_PORT: "8771"
      # Default languages when a request doesn't specify (the api passes
      # TESSERACT_LANGS per request). Must match the traineddata baked into the
      # sidecar image (see infrastructure/Dockerfile.tesseract).
      TESSERACT_DEFAULT_LANGS: ${TESSERACT_LANGS:-chi_sim+chi_tra+eng+jpn}
      # Bounded worker pool — returns 503 (retryable) when saturated so a burst
      # of parses can't blow every request's timeout on one CPU container.
      TESSERACT_MAX_CONCURRENCY: ${TESSERACT_MAX_CONCURRENCY:-2}
    expose:
      - "8771"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys,json; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8771/healthz'))['ready'] else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    profiles:
      - production

  # Optional Mijia (Xiaomi smart-home) MCP sidecar. Multi-tenant: per-request
  # Xiaomi credentials arrive in the X-Mijia-Auth header from the API; nothing
  # is stored here long-term. Internal-only (no host port). Gate with the
  # `mijia` profile, e.g.:
  #   docker compose --profile production --profile mijia up -d --build mijia-mcp api
  mijia-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.mijia-mcp
    container_name: synapse-mijia-mcp
    restart: unless-stopped
    logging: *default-logging
    # Explicit env allowlist — deliberately NOT env_file:[.env], so the sidecar
    # never receives DB/JWT/OAuth/third-party secrets. Xiaomi creds come per
    # request via headers, not env.
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8765"
      MIJIA_QR_OPEN_MODE: none
      MIJIA_LOG_LEVEL: ${MIJIA_LOG_LEVEL:-info}
      MIJIA_TENANT_ROOT: /data/tenants
      # OTLP tracing (P7): set to http://alloy:4318 with the observability
      # profile so mijia exports request spans into the cross-process trace tree.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: mijia-mcp
    # Internal network only — reachable by the api container at
    # http://mijia-mcp:8765/mcp/, not exposed to the host.
    expose:
      - "8765"
    profiles:
      - mijia

  # Optional Notion MCP sidecar. Multi-tenant: per-request Notion integration
  # tokens arrive in a header from the API; nothing is stored here long-term.
  # Internal-only (no host port). Gate with the `notion` profile, e.g.:
  #   docker compose --profile production --profile notion up -d --build notion-mcp api
  notion-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.notion-mcp
    container_name: synapse-notion-mcp
    restart: unless-stopped
    logging: *default-logging
    # Explicit env allowlist — deliberately NOT env_file:[.env], so the sidecar
    # never receives DB/JWT/OAuth/third-party secrets. Notion tokens come per
    # request via headers, not env.
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8766"
      NOTION_LOG_LEVEL: ${NOTION_LOG_LEVEL:-info}
      NOTION_TENANT_ROOT: /data/tenants
      # OTLP tracing (P7): set to http://alloy:4318 with the observability
      # profile so notion exports request spans into the cross-process trace tree.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: notion-mcp
    # Internal network only — reachable by the api container at
    # http://notion-mcp:8766/mcp/, not exposed to the host.
    expose:
      - "8766"
    profiles:
      - notion

  # Optional 小红书 (Xiaohongshu) MCP sidecar. Heavier than the others: it runs
  # a headless browser backend per tenant (capped by XHS_MAX_TENANT_BACKENDS),
  # so it gets a memory limit + shared-memory size. Per-tenant cookies are set
  # per-backend by the adapter (COOKIES_PATH is NEVER container-level). Tenant
  # state persists in the xhs_tenants volume. Gate with the `xhs` profile, e.g.:
  #   docker compose --profile production --profile xhs up -d --build xhs-mcp api
  xhs-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.xhs-mcp
    container_name: synapse-xhs-mcp
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XHS_MEM_LIMIT:-6g}
    shm_size: ${XHS_SHM_SIZE:-1g}
    # Explicit env allowlist — deliberately NOT env_file:[.env]. Per-tenant
    # 小红书 cookies are set per-backend by the adapter (COOKIES_PATH), never
    # at the container level.
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8769"
      XHS_LOG_LEVEL: ${XHS_LOG_LEVEL:-info}
      XHS_TENANT_ROOT: /data/tenants
      XHS_MAX_TENANT_BACKENDS: ${XHS_MAX_TENANT_BACKENDS:-3}
      XHS_BACKEND_IDLE_TTL_SECONDS: ${XHS_BACKEND_IDLE_TTL_SECONDS:-1800}
      XHS_STORAGE_HOSTS: ${XHS_STORAGE_HOSTS:-}
      # OTLP tracing (P7): set to http://alloy:4318 with the observability
      # profile so xhs exports request spans into the cross-process trace tree.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: xhs-mcp
    # Internal network only — reachable by the api container at
    # http://xhs-mcp:8769/mcp/, not exposed to the host.
    expose:
      - "8769"
    volumes:
      - xhs_tenants:/data/tenants
    profiles:
      - xhs

  # Optional Bilibili MCP sidecar (LIB-WRAP over the GPL-3.0 bilibili-api
  # library). Per-request Bilibili web Cookies arrive in the X-Bili-Cookie
  # header; nothing is baked in. The Python base on 8768 is the only listener.
  # Internal-only (no host port). Gate with the `bilibili` profile, e.g.:
  #   docker compose --profile production --profile bilibili up -d --build bilibili-mcp api
  bilibili-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.bilibili-mcp
    container_name: synapse-bilibili-mcp
    restart: unless-stopped
    logging: *default-logging
    # Explicit env allowlist — deliberately NOT env_file:[.env]. Bilibili creds
    # come per request via the X-Bili-Cookie header, not env.
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8768"
      BILIBILI_LOG_LEVEL: ${BILIBILI_LOG_LEVEL:-info}
      BILIBILI_TENANT_ROOT: /data/tenants
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: bilibili-mcp
    # Internal network only — reachable by the api container at
    # http://bilibili-mcp:8768/mcp/, not exposed to the host.
    expose:
      - "8768"
    profiles:
      - bilibili

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required. Run ./setup.sh first.}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required. Run ./setup.sh first.}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required. Run ./setup.sh first.}
        API_PROXY_ORIGIN: http://api:3001
    container_name: synapse-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required. Run ./setup.sh first.}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required. Run ./setup.sh first.}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required. Run ./setup.sh first.}
      API_PROXY_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles:
      - production

  mobile-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.mobile-web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?EXPO_PUBLIC_API_URL is required. Run ./setup.sh first.}
        EXPO_PUBLIC_AUTH_ORIGIN: ${EXPO_PUBLIC_AUTH_ORIGIN:-}
        EXPO_BASE_URL: ${EXPO_BASE_URL:-/mobile}
    container_name: synapse-mobile-web
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    profiles:
      - production

  nginx:
    # Custom pinned image: nginx 1.31.2 (HTTP/3 CVE fix) + brotli + zstd modules
    # + web /_next/static baked in with RFC 9842 dcb/dcz variants. Build the web
    # image FIRST (this COPYs its .next/static). See infrastructure/Dockerfile.nginx
    # + docs/logging-refactor/07-edge-compression-and-cdt-plan.md.
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nginx
      args:
        WEB_IMAGE: ${COMPOSE_PROJECT_NAME:-synapse}-web:latest
    container_name: synapse-nginx
    restart: unless-stopped
    logging: *default-logging
    cpus: "1.0"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
      SYNAPSE_PUBLIC_DOMAIN: ${SYNAPSE_PUBLIC_DOMAIN:?SYNAPSE_PUBLIC_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_WWW_DOMAIN: ${SYNAPSE_WWW_DOMAIN:?SYNAPSE_WWW_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_MOBILE_SHORT_DOMAIN: ${SYNAPSE_MOBILE_SHORT_DOMAIN:?SYNAPSE_MOBILE_SHORT_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_MOBILE_DOMAIN: ${SYNAPSE_MOBILE_DOMAIN:?SYNAPSE_MOBILE_DOMAIN is required. Run ./setup.sh first.}
      SYNAPSE_REGISTRY_DOMAIN: ${SYNAPSE_REGISTRY_DOMAIN:?SYNAPSE_REGISTRY_DOMAIN is required. Run ./setup.sh first.}
      LETSENCRYPT_CERT_NAME: ${LETSENCRYPT_CERT_NAME:?LETSENCRYPT_CERT_NAME is required. Run ./setup.sh first.}
    volumes:
      - ./infrastructure/nginx/public.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - mobile-web
    profiles:
      - tls

  nginx-http:
    image: nginx:alpine
    container_name: synapse-nginx-http
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${SYNAPSE_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/public-http.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
      - web
      - mobile-web
    profiles:
      - http

  acme-http:
    image: nginx:alpine
    container_name: synapse-acme-http
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - certbot_www:/usr/share/nginx/html
    profiles:
      - certbot

  certbot:
    image: certbot/certbot:latest
    container_name: synapse-certbot
    logging: *default-logging
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - certbot

  # Device Runtime v3: reverse-tunnel edge (frps). Devices dial in here from
  # arbitrary networks; proxied app endpoints stay on the internal docker
  # network (only the API container reaches them). See
  # docs/device-runtime-v3.md §4.4 / §7.3.
  tunnel-edge:
    # Built locally from the official frp release tarball (see
    # infrastructure/Dockerfile.frps) instead of the Docker Hub
    # snowdreamtech/frp image, which is not reliably pullable in all networks.
    image: synapse-tunnel-edge:0.65.0
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frps
    container_name: synapse-tunnel-edge
    restart: unless-stopped
    logging: *default-logging
    # The image ENTRYPOINT already runs `frps -c /etc/frp/frps.toml`.
    environment:
      # frps.toml renders auth.token from {{ .Envs.FRP_SHARED_TOKEN }}.
      FRP_SHARED_TOKEN: ${FRP_SHARED_TOKEN:-}
    volumes:
      - ./infrastructure/frp/frps.toml:/etc/frp/frps.toml:ro
    ports:
      # Public control listener — frpc dials this from anywhere.
      - "${SYNAPSE_TUNNEL_EDGE_PORT:-7000}:7000"
      # vhost HTTP — proxied device MCP endpoints. NOT bound to a host port;
      # only reachable via the synapse internal networks.
    networks:
      # default → reachable by the API for dispatch; sandbox-egress → reachable
      # by frpc inside sandbox containers.
      - default
      - synapse-sandbox-egress
    profiles:
      # Sandboxed actor execution dispatches device tools through this edge, so
      # it must run in production too (not only the standalone 'devices' demo).
      - devices
      - production

  # Private npm registry (Verdaccio). Serves @synapse/* to end users and
  # caches third-party deps from npmjs. Published at the registry subdomain
  # via the public nginx (TLS terminated there); the 4873 host port is
  # bound to loopback only so the registry is never directly exposed. The
  # real registry hostname lives only in the gitignored .env
  # (SYNAPSE_REGISTRY_DOMAIN / PUBLIC_NPM_REGISTRY_URL), never in the repo.
  # See infra/verdaccio/README.md for publisher setup + the deny smoke test.
  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: synapse-verdaccio
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - ./infra/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - ./infra/verdaccio/htpasswd:/verdaccio/conf/htpasswd
      - verdaccio_storage:/verdaccio/storage
    profiles:
      - registry

  # Build-only: produces the cloud-sandbox image the docker SandboxBackend runs
  # via DooD. NOT a long-running service. Build it with:
  #   docker compose --profile sandbox-build build sandbox-image
  # then set SYNAPSE_SANDBOX_IMAGE=synapse-device-runtime:latest. Self-contained
  # multi-stage (compiles TS + Rust inside), so no host prebuild is needed.
  sandbox-image:
    image: ${SYNAPSE_SANDBOX_IMAGE:-synapse-device-runtime:latest}
    build:
      context: .
      dockerfile: packages/device-runtime/docker/Dockerfile
    profiles:
      - sandbox-build

  # --- Observability stack (logging refactor): self-hosted Loki (logs) + Tempo
  # (traces) + Alloy (shipper) + Grafana (query/UI). Opt-in via the
  # `observability` profile. Pin image tags to current versions for your deploy.
  # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318 on the api to export traces.
  loki:
    image: grafana/loki:3.3.0
    container_name: synapse-loki
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infrastructure/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    container_name: synapse-tempo
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infrastructure/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    profiles:
      - observability

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: synapse-alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      # Scope log discovery to this compose project (config.alloy keep-rule).
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-synapse}
    volumes:
      - ./infrastructure/observability/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only docker socket + container logs — ONLY on this dedicated shipper,
      # never on the api container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "4317"
      - "4318"
      - "12345"
    depends_on:
      - loki
      - tempo
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.4.0
    container_name: synapse-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - loki
      - tempo
    profiles:
      - observability

volumes:
  # Fixed name so the docker SandboxBackend's `--mount src=...` resolves the
  # volume regardless of the compose project prefix.
  api_storage:
    name: synapse_api_storage
  certbot_etc:
  certbot_www:
  pgdata:
  redisdata:
  # Per-tenant 小红书 backend state (browser profiles / cookies) for the
  # optional xhs-mcp sidecar (compose `xhs` profile).
  xhs_tenants:
  verdaccio_storage:
  loki_data:
  tempo_data:
  alloy_data:
  grafana_data:

networks:
  default:
  # Internal-only network for sandbox containers: reaches the API + tunnel-edge
  # (frpc/control-plane), but has NO public egress (internal: true) and is NOT
  # joined by postgres/redis — so a confined command sharing the container's
  # netns (--cmd-sandbox-share-net) can't reach the DB or the internet. Fixed
  # name so the backend's `docker run --network` matches.
  synapse-sandbox-egress:
    name: synapse-sandbox-egress
    internal: true
