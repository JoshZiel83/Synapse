services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Run ./setup.sh first.}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Run ./setup.sh first.}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  spicedb:
    image: quay.io/authzed/spicedb:latest
    container_name: synapse-spicedb
    command: serve-testing
    ports:
      - "127.0.0.1:50051:50051"

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    container_name: synapse-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synapse}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Run ./setup.sh first.}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required. Run ./setup.sh first.}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required.}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:?ANTHROPIC_BASE_URL is required.}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required.}
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      AUTHZ_ENABLED: "true"
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_TOKEN:-synapse-dev-token}
      SPICEDB_INSECURE: "true"
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-demo@synapse.dev}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spicedb:
        condition: service_started
    profiles:
      - production

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    container_name: synapse-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles:
      - production

  nginx:
    image: nginx:alpine
    container_name: synapse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
