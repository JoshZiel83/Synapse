[package]
name = "synapse-device-fs-helper"
version = "0.1.0"
edition = "2021"
description = "Synapse device-runtime filesystem helper: history, indexed search, extract"
license = "Apache-2.0"

[[bin]]
name = "synapse-device-fs-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "sync", "time"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
rusqlite = { version = "0.34", features = ["bundled"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
similar = "2"
mime_guess = "2"
walkdir = "2"
nucleo-matcher = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
getrandom = "0.2"
tracing = "0.1"
# default-features=false drops the ANSI dep — logs are structured JSON to stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"

[dev-dependencies]
tempfile = "3"
