<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none" role="img" aria-label="设计参考截图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="16" fill="url(#bg)"/>
  <!-- top nav -->
  <circle cx="40" cy="40" r="10" fill="#4f46e5"/>
  <rect x="470" y="32" width="60" height="16" rx="8" fill="#c7d2fe"/>
  <rect x="546" y="30" width="64" height="20" rx="10" fill="url(#cta)"/>
  <!-- hero copy -->
  <rect x="40" y="120" width="300" height="26" rx="6" fill="#312e81"/>
  <rect x="40" y="156" width="230" height="26" rx="6" fill="#312e81"/>
  <rect x="40" y="204" width="360" height="12" rx="6" fill="#a5b4fc"/>
  <rect x="40" y="224" width="320" height="12" rx="6" fill="#a5b4fc"/>
  <rect x="40" y="264" width="132" height="40" rx="20" fill="url(#cta)"/>
  <rect x="184" y="264" width="120" height="40" rx="20" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
  <!-- hero art -->
  <rect x="400" y="110" width="200" height="200" rx="20" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
  <circle cx="500" cy="185" r="38" fill="#818cf8"/>
  <rect x="430" y="245" width="140" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="430" y="268" width="96" height="12" rx="6" fill="#e0e7ff"/>
</svg>
