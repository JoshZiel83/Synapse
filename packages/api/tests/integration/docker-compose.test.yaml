name: ${INT_PROJECT_NAME:-synapse-int-test}

# Isolated postgres+redis for the API integration test suite.
#
# Per-worktree isolated: the compose project name and host ports are derived
# from the worktree path by scripts/lib.sh (deterministic offset + conflict
# probing), so multiple worktrees can run their own stacks concurrently without
# colliding. The ${INT_*_PORT} values are injected by up.sh / run-test.sh; the
# `:-` defaults below only apply if you run `docker compose` by hand without
# sourcing lib.sh. Container names are NOT pinned — `-p $INT_PROJECT_NAME` plus
# compose labels (com.docker.compose.project) namespace everything.
#
# Run via:
#   bash packages/api/tests/integration/scripts/up.sh
#   bash packages/api/tests/integration/scripts/down.sh

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: synapse_test
    ports:
      - "127.0.0.1:${INT_PG_PORT:-55433}:5432"
    volumes:
      - pgdata_int_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7-alpine
    restart: "no"
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${INT_REDIS_PORT:-56380}:6379"
    volumes:
      - redisdata_int_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata_int_test:
  redisdata_int_test:
