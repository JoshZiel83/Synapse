name: synapse-canonical-content-blocks-demo

# Demo override that adds the web frontend (and an nginx in front so the
# browser-served bundle and the API live on the same origin, avoiding
# CORS/cookie/WS gymnastics). All ports are worktree-private — no
# collision with the production stack on this machine.
#
# Usage:
#   bash packages/api/tests/integration/scripts/up.sh
#   docker compose -p synapse-canonical-content-blocks \
#     -f packages/api/tests/integration/docker-compose.test.yaml \
#     -f packages/api/tests/integration/docker-compose.prod.yaml \
#     -f packages/api/tests/integration/docker-compose.demo.yaml \
#     up -d --wait --build
#   # browser → http://127.0.0.1:38080

services:
  api:
    # Keep api on its 38001 host port for direct curl/debugging, but the
    # browser will hit it via nginx on 38080 so cookies & WS work cleanly.
    ports: !override
      - "127.0.0.1:38001:3001"

  web:
    build:
      context: ../../../..
      dockerfile: infrastructure/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        # WS URL intentionally empty — the FE's resolveWebSocketUrl falls
        # back to `${window.location.protocol}//${window.location.host}/ws`
        # when this is unset, which Just Works from any browser regardless
        # of the host's IP. Bakining a fixed IP would break remote access.
        NEXT_PUBLIC_WS_URL: ""
        NEXT_PUBLIC_APP_URL: ""
        NEXT_PUBLIC_SITE_URL: ""
        API_PROXY_ORIGIN: http://api:3001
    container_name: synapse-cb-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ""
      NEXT_PUBLIC_APP_URL: ""
      NEXT_PUBLIC_SITE_URL: ""
      API_PROXY_ORIGIN: http://api:3001
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: synapse-cb-nginx
    restart: unless-stopped
    ports:
      # Bound to 0.0.0.0 so the demo is reachable from outside the host
      # (matches the production nginx pattern). Worktree-isolated to
      # port 38080 to avoid colliding with the production 80/443 nginx.
      - "38080:80"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
