# Synapse staging compose — per-worktree isolated stack.
#
# All container names, volume names, and host ports are scoped to the
# current worktree via the variables loaded by
# `source infrastructure/scripts/staging-env.sh`.
#
# Bring up:
#   source infrastructure/scripts/staging-env.sh
#   docker compose -f docker-compose.staging.yml --profile staging up -d --build
#
# Tear down (releases ports + volumes):
#   ./infrastructure/scripts/teardown-staging.sh
#
# This file is INDEPENDENT of docker-compose.yml: it never touches prod
# containers/volumes/ports. Profile name `staging` is also unique so
# `docker compose --profile production` won't accidentally start it.

name: synapse-stg-${SYNAPSE_STAGING_SLUG}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run source infrastructure/scripts/staging-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-synapse_staging}
    ports:
      - "127.0.0.1:${PG_PORT:?run source infrastructure/scripts/staging-env.sh first}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - staging

  redis:
    image: redis:7-alpine
    container_name: synapse-redis-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?run source infrastructure/scripts/staging-env.sh first}
    ports:
      - "127.0.0.1:${REDIS_PORT:?run source infrastructure/scripts/staging-env.sh first}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - staging

  socks-bridge:
    # Bridges the host's <redacted-outbound-proxy> to an internal HTTP proxy at
    # http://socks-bridge:8118, consumed by other staging services that need
    # outbound access to provider-specific AI endpoint during build/runtime.
    image: ginuerzh/gost
    container_name: synapse-socks-bridge-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    command: -L=http://:8118 -F=socks5://host.docker.internal:1080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - staging

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    image: synapse-api-stg:${SYNAPSE_STAGING_SLUG}
    container_name: synapse-api-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synapse_staging}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?run source infrastructure/scripts/staging-env.sh first}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?run source infrastructure/scripts/staging-env.sh first}
      APP_BASE_URL: ${SYNAPSE_STAGING_APP_URL:?run source infrastructure/scripts/staging-env.sh first}
      BASE_URL: ${SYNAPSE_STAGING_APP_URL}
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-staging-admin@synapse.test}
      STORAGE_DIR: /app/storage/files
      MEMORY_ALLOW_RUNTIME_MODEL_DOWNLOAD: ${MEMORY_ALLOW_RUNTIME_MODEL_DOWNLOAD:-false}
      MEMORY_MODEL_CACHE_DIR: /app/storage/models/memory
      # Runtime-only proxy for outbound provider-specific AI endpoint calls. NO_PROXY lists all
      # in-network services so internal hops bypass the bridge.
      HTTPS_PROXY: http://socks-bridge:8118
      HTTP_PROXY: http://socks-bridge:8118
      NO_PROXY: localhost,127.0.0.1,postgres,redis,api,web,mobile-web,socks-bridge
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      socks-bridge:
        condition: service_started
    profiles:
      - staging

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: ${SYNAPSE_STAGING_WS_URL:?run source infrastructure/scripts/staging-env.sh first}
        NEXT_PUBLIC_APP_URL: ${SYNAPSE_STAGING_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${SYNAPSE_STAGING_APP_URL}
        API_PROXY_ORIGIN: http://api:3001
    image: synapse-web-stg:${SYNAPSE_STAGING_SLUG}
    container_name: synapse-web-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ${SYNAPSE_STAGING_WS_URL}
      NEXT_PUBLIC_APP_URL: ${SYNAPSE_STAGING_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${SYNAPSE_STAGING_APP_URL}
      API_PROXY_ORIGIN: http://api:3001
    depends_on:
      - api
    profiles:
      - staging

  mobile-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.mobile-web
      args:
        EXPO_PUBLIC_API_URL: ${SYNAPSE_STAGING_APP_URL}/api/v1
        EXPO_BASE_URL: /mobile
    image: synapse-mobile-web-stg:${SYNAPSE_STAGING_SLUG}
    container_name: synapse-mobile-web-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    expose:
      - "80"
    profiles:
      - staging

  nginx-http:
    image: nginx:alpine
    container_name: synapse-nginx-http-stg-${SYNAPSE_STAGING_SLUG}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:?run source infrastructure/scripts/staging-env.sh first}:80"
    volumes:
      - ./infrastructure/nginx/public-http.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
      - web
      - mobile-web
    profiles:
      - staging

volumes:
  api_storage:
  pgdata:
  redisdata:
