# Synapse Relay Agent Configuration
# Copy this file to config.yaml and fill in your values

# WebSocket endpoint to connect to (REQUIRED)
endpoint: "wss://your-synapse-server.com/ws/relay"

# Authentication token (REQUIRED, obtained from Synapse dashboard)
token: "your-relay-auth-token-here"

# Log level: debug, info, warn, error
log_level: "info"

# Local MCP servers to expose
