services:
  windows:
    image: dockurr/windows
    container_name: synapse-relay-windows-builder
    environment:
      VERSION: "${SYNAPSE_RELAY_WINDOWS_VERSION:-2022}"
      RAM_SIZE: "${SYNAPSE_RELAY_WINDOWS_RAM:-16G}"
      CPU_CORES: "${SYNAPSE_RELAY_WINDOWS_CPUS:-8}"
      DISK_SIZE: "${SYNAPSE_RELAY_WINDOWS_DISK:-128G}"
      USERNAME: "${SYNAPSE_RELAY_WINDOWS_USER:-Docker}"
      PASSWORD: "${SYNAPSE_RELAY_WINDOWS_PASSWORD:-admin}"
      LANGUAGE: "${SYNAPSE_RELAY_WINDOWS_LANGUAGE:-English}"
      REGION: "${SYNAPSE_RELAY_WINDOWS_REGION:-en-US}"
      KEYBOARD: "${SYNAPSE_RELAY_WINDOWS_KEYBOARD:-en-US}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    privileged: true
    ports:
      - "${SYNAPSE_RELAY_WINDOWS_WEB_PORT:-8006}:8006"
      - "${SYNAPSE_RELAY_WINDOWS_RDP_PORT:-3389}:3389/tcp"
      - "${SYNAPSE_RELAY_WINDOWS_RDP_PORT:-3389}:3389/udp"
    volumes:
      - "${SYNAPSE_RELAY_WINDOWS_STORAGE:-./.synapse-relay-vms/windows}:/storage"
      - "${SYNAPSE_RELAY_VM_SHARED:-../../../}:/shared"
    restart: unless-stopped
    stop_grace_period: 2m

  macos:
    image: dockurr/macos
    container_name: synapse-relay-macos-builder
    profiles:
      - macos
    environment:
      VERSION: "${SYNAPSE_RELAY_MACOS_VERSION:-14}"
      RAM_SIZE: "${SYNAPSE_RELAY_MACOS_RAM:-16G}"
      CPU_CORES: "${SYNAPSE_RELAY_MACOS_CPUS:-8}"
      DISK_SIZE: "${SYNAPSE_RELAY_MACOS_DISK:-128G}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    privileged: true
    ports:
      - "${SYNAPSE_RELAY_MACOS_WEB_PORT:-8007}:8006"
      - "${SYNAPSE_RELAY_MACOS_VNC_PORT:-5901}:5900/tcp"
      - "${SYNAPSE_RELAY_MACOS_VNC_PORT:-5901}:5900/udp"
    volumes:
      - "${SYNAPSE_RELAY_MACOS_STORAGE:-./.synapse-relay-vms/macos}:/storage"
      - "${SYNAPSE_RELAY_VM_SHARED:-../../../}:/shared"
    restart: unless-stopped
    stop_grace_period: 2m
