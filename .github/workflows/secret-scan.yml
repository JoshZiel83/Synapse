name: secret-scan

# Defense-in-depth backstop for the local pre-commit gitleaks hook. The hook is
# bypassable (git commit --no-verify) and not installed on every clone, so CI is
# the enforcing layer. Runs the SAME pinned gitleaks via scripts/ensure-gitleaks.sh
# (one source of truth) over FULL history — not just the staged diff — so a secret
# that slipped past the hook is still caught. Known historical findings are
# absorbed by .gitleaks-baseline.json. See docs/secret-scanning.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — checkout defaults to a single commit, which would make
          # `gitleaks git` scan almost nothing.
          fetch-depth: 0
      - name: Run gitleaks (full history)
        run: |
          bin="$(bash scripts/ensure-gitleaks.sh)"
          "$bin" git --redact --no-banner \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --baseline-path "$GITHUB_WORKSPACE/.gitleaks-baseline.json"
