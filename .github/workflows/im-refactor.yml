name: IM refactor — staging tests

on:
  pull_request:
    paths:
      - "packages/**"
      - "infrastructure/**"
      - "docker-compose.yml"
      - "docker-compose.staging.yml"
      - ".github/workflows/im-refactor.yml"
  workflow_dispatch: {}

concurrency:
  group: im-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Run API unit tests
        run: npm test -w packages/api

      - name: Allocate staging ports + bring up stack
        run: |
          set -euo pipefail
          source infrastructure/scripts/staging-env.sh
          docker compose -f docker-compose.staging.yml --profile staging up -d --build
          for i in {1..60}; do
            if docker inspect --format '{{.State.Health.Status}}' "synapse-postgres-stg-${SYNAPSE_STAGING_SLUG}" 2>/dev/null | grep -q healthy; then
              break
            fi
            sleep 2
          done
          docker run --rm \
            --network "synapse-stg-${SYNAPSE_STAGING_SLUG}_default" \
            -e DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            -e REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379" \
            "synapse-api-stg:${SYNAPSE_STAGING_SLUG}" \
            node /app/packages/api/dist/infrastructure/database/bootstrap.js
          docker run --rm \
            --network "synapse-stg-${SYNAPSE_STAGING_SLUG}_default" \
            -e DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            -e REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379" \
            -e PLATFORM_ADMIN_EMAILS="${PLATFORM_ADMIN_EMAILS}" \
            "synapse-api-stg:${SYNAPSE_STAGING_SLUG}" \
            node /app/packages/api/dist/infrastructure/database/seed.js || true
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:${NGINX_PORT}/api/v1/health" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: API integration smoke
        run: |
          source infrastructure/scripts/staging-env.sh
          STAGING_API_URL="http://127.0.0.1:${NGINX_PORT}/api/v1" \
            npm run test:integration -w packages/api

      - name: Playwright E2E (web + mobile, via official Docker image)
        run: |
          source infrastructure/scripts/staging-env.sh
          ./infrastructure/scripts/run-e2e.sh --reporter=list

      - name: Tear down staging
        if: always()
        run: |
          source infrastructure/scripts/staging-env.sh || true
          ./infrastructure/scripts/teardown-staging.sh || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          if-no-files-found: ignore
