name: Build Relay GUI

on:
  push:
    branches:
      - '**'
    # paths:
    #   - 'relay/**'
    #   - '.github/workflows/relay-gui-build.yml'
    tags:
      - 'relay-gui-v*'
  pull_request:
    # paths:
    #   - 'relay/**'
    #   - '.github/workflows/relay-gui-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  BUNDLED_NODE_VERSION: '20.19.5'
  CHROME_DEVTOOLS_MCP_VERSION: '0.20.0'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            wails_tags: desktop_cua,webkit2_41
            setup: |
              sudo apt-get update -qq
              sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev
          - runner: macos-15
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            wails_tags: desktop_cua
            setup: ''
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            wails_tags: desktop_cua
            setup: ''
          - runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            wails_tags: desktop_cua
            setup: ''

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BUNDLED_NODE_VERSION }}

      - name: Platform setup
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#relay-gui-}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare bundled Chrome DevTools runtime
        run: node relay/scripts/prepare-chrome-devtools-bundle.mjs --target-platform=${{ matrix.goos }}-${{ matrix.goarch }} --node-version=${{ env.BUNDLED_NODE_VERSION }} --package-version=${{ env.CHROME_DEVTOOLS_MCP_VERSION }}

      - name: Build GUI
        working-directory: relay/cmd/synapse-relay-gui
        run: wails build -tags "${{ matrix.wails_tags }}" -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}"

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            main_exe="$(find relay/cmd/synapse-relay-gui/build/bin -maxdepth 1 -type f \( -name 'synapse-relay-gui.exe' -o -name 'synapse-relay-gui-windows-*.exe' \) ! -name '*-setup.exe' | head -n 1)"
            setup_exe="$(find relay/cmd/synapse-relay-gui/build/bin -maxdepth 1 -type f -name 'synapse-relay-gui*-setup.exe' | head -n 1)"
            test -n "$main_exe"
            test -n "$setup_exe"
            mv "$main_exe" synapse-relay-gui-${{ matrix.suffix }}.exe
            mv "$setup_exe" synapse-relay-gui-${{ matrix.suffix }}-setup.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            app_path="relay/cmd/synapse-relay-gui/build/bin/Synapse Relay.app"
            test -d "$app_path"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "synapse-relay-gui-${{ matrix.suffix }}.zip"
            hdiutil create -volname "Synapse Relay" -srcfolder "$app_path" -ov -format UDZO "synapse-relay-gui-${{ matrix.suffix }}.dmg"
          else
            mv relay/cmd/synapse-relay-gui/build/bin/synapse-relay-gui synapse-relay-gui-${{ matrix.suffix }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-relay-gui-${{ matrix.suffix }}
          path: synapse-relay-gui-${{ matrix.suffix }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
