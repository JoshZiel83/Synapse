# Isolated E2E stack for the remote-agent daemon refactor (Phase 6).
#
# Use scripts/remote-agent-e2e.sh, which derives a unique RAE_STACK_ID from the
# current worktree's branch name, probes free ports, and writes the chosen ports
# to infrastructure/.rae-state/<id>.env so this file can reference them.
#
# All resource names are suffixed with ${RAE_STACK_ID} so multiple worktrees can
# run this stack in parallel without colliding. Never run plain
# `docker compose -f this -p ANY-OTHER-NAME` — the helper script enforces the
# project name.

x-rae-defaults: &rae-defaults
  restart: "no"

services:
  rae-postgres:
    <<: *rae-defaults
    image: pgvector/pgvector:pg16
    container_name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "127.0.0.1:${RAE_POSTGRES_PORT:?RAE_POSTGRES_PORT is required}:5432"
    volumes:
      - rae-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  rae-redis:
    <<: *rae-defaults
    image: redis:7-alpine
    container_name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${RAE_REDIS_PORT:?RAE_REDIS_PORT is required}:6379"
    volumes:
      - rae-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rae-api:
    <<: *rae-defaults
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    container_name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-api
    network_mode: host
    environment:
      DATABASE_URL: postgresql://synapse:synapse@127.0.0.1:${RAE_POSTGRES_PORT:?RAE_POSTGRES_PORT is required}/synapse
      REDIS_URL: redis://127.0.0.1:${RAE_REDIS_PORT:?RAE_REDIS_PORT is required}
      JWT_SECRET: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-jwt
      JWT_REFRESH_SECRET: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-refresh
      NODE_ENV: production
      PORT: "${RAE_API_PORT:?RAE_API_PORT is required}"
      HOST: "127.0.0.1"
      PLATFORM_ADMIN_EMAILS: demo@synapse.dev
    depends_on:
      rae-postgres:
        condition: service_healthy
      rae-redis:
        condition: service_healthy

  rae-daemon:
    <<: *rae-defaults
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.remote-agent-daemon
    container_name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-daemon
    network_mode: host
    environment:
      SYNAPSE_MACHINE_KEY: ${SYNAPSE_MACHINE_KEY:-}
      SYNAPSE_REMOTE_AGENT_STATE_DIR: /home/synapse/.synapse/remote-agents
      SYNAPSE_REMOTE_AGENT_LOG_LEVEL: ${SYNAPSE_REMOTE_AGENT_LOG_LEVEL:-info}
      # Opt the e2e stack into the host's SOCKS5 tunnel so claude / codex
      # can reach example.invalid/ai-gateway. Real deployments leave this unset.
      SYNAPSE_AGENT_PROXY_URL: ${SYNAPSE_AGENT_PROXY_URL:-<redacted-outbound-proxy>}
    volumes:
      # Mount under the synapse user's HOME, not /root — the daemon now runs
      # as uid 1100 (see Dockerfile) so claude refuses --dangerously-skip-permissions
      # if it's started as root and refuses to find its config if HOME doesn't
      # match. The volume's owner needs to be the synapse uid so the daemon can
      # write to it; docker bind-mounts inherit the host file's ownership for
      # the read-only config files (read-only is fine, no write needed), and the
      # named state volume gets chowned on first start of the container by the
      # Dockerfile's USER directive.
      - /projects/claude-settings.json:/home/synapse/.claude/settings.json:ro
      - /projects/codex-config.toml:/home/synapse/.codex/config.toml:ro
      - rae-daemon-state:/home/synapse/.synapse/remote-agents
    command:
      - "--server-url"
      - "http://127.0.0.1:${RAE_API_PORT:?RAE_API_PORT is required}"
      - "--api-key"
      - "${SYNAPSE_MACHINE_KEY:?SYNAPSE_MACHINE_KEY must be exported before running the daemon}"
    depends_on:
      - rae-api

volumes:
  rae-pgdata:
    name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-pgdata
  rae-redisdata:
    name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-redisdata
  rae-daemon-state:
    name: rae-${RAE_STACK_ID:?RAE_STACK_ID is required}-daemon-state
