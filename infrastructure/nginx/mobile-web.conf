server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /mobile/;
    }

    location = /mobile/chat-service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/mobile/" always;
        try_files $uri =404;
    }

    location ~ ^/mobile/(?:.*\/)?\.[^/]+ {
        return 404;
    }

    location ~* ^/mobile/.+\.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /mobile/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /mobile/index.html;
    }

    location / {
        return 404;
    }
}
