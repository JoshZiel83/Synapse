# Grafana Tempo — single-binary, local storage. Self-hosted trace store for the
# Synapse `observability` profile. Receives OTLP spans (forwarded by Alloy) and
# is queried by Grafana (linked from Loki logs via the shared trace_id).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h # 14 days

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
