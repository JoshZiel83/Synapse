# Grafana Tempo — single-binary, local storage. Self-hosted trace store for the
# Synapse `observability` profile. Receives OTLP spans (forwarded by Alloy) and
# is queried by Grafana (linked from Loki logs via the shared trace_id).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h # 14 days

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# ─── Last-resort ingest bounds (Ring-0 defense in depth) ────────────────────
# Previously INHERITED defaults, written out so the final bound on a forged or
# flooded trace is reviewable in-repo. These are NOT the primary control: they
# are per-tenant and this deployment is single-tenant, so tripping them drops
# LEGITIMATE traces too (denial of monitoring). The primary control is the nginx
# limit_req/limit_conn at the public edge; this is the backstop under it.
# Validate before shipping any edit:
#   docker run --rm -v $PWD/infrastructure/observability/tempo-config.yaml:\
#     /etc/tempo/config.yaml:ro grafana/tempo:2.6.1 \
#     -config.file=/etc/tempo/config.yaml -config.verify=true
# (a typo'd key fails loudly: "field ... not found in type overrides.legacyConfig").
overrides:
  defaults:
    ingestion:
      rate_strategy: local
      rate_limit_bytes: 15000000 # ~15 MB/s sustained per tenant
      burst_size_bytes: 20000000
      max_traces_per_user: 10000 # live traces held by the ingester
    global:
      max_bytes_per_trace: 5000000 # one trace id can never exceed 5 MB
